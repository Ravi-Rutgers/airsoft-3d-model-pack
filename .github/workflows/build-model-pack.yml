name: Build 3D Model Pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf airsoft_3d_model_pack
          mkdir -p airsoft_3d_model_pack
          cp -R models airsoft_3d_model_pack/models
          cp models.json airsoft_3d_model_pack/models.json
          cp README.md airsoft_3d_model_pack/README.md
          mkdir -p airsoft_3d_model_pack/LICENSES
          cp LICENSES/*.md airsoft_3d_model_pack/LICENSES/ || true

      - name: Generate per-model metadata and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path

          root = Path("airsoft_3d_model_pack")
          data = json.loads((root / "models.json").read_text())
          models_dir = root / "models"

          # Validate index entries and generate per-model metadata.
          for item in data:
              p = root / item["modelFile"]
              if not p.exists() or p.stat().st_size == 0:
                  raise SystemExit(f"Missing model: {p}")
              raw = p.read_bytes()
              if raw[:4] != b"glTF":
                  raise SystemExit(f"Invalid GLB header: {p}")
              item["sha256"] = hashlib.sha256(raw).hexdigest()
              item["fileSizeBytes"] = len(raw)
              meta = dict(item)
              meta.pop("thumbnail", None)
              (p.parent / "metadata.json").write_text(
                  json.dumps(meta, indent=2) + "\n", encoding="utf-8"
              )

          (root / "models.json").write_text(
              json.dumps(data, indent=2) + "\n", encoding="utf-8"
          )

          count = len(list(models_dir.rglob("model.glb")))
          if count != len(data):
              raise SystemExit(f"Index/model mismatch: {len(data)} vs {count}")

          if count < 30:
              raise SystemExit(f"Expected at least 30 models, found {count}")

          print(f"Validated {count} GLB models")
          PY

      - name: Package ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd airsoft_3d_model_pack
          zip -qr ../airsoft_3d_model_pack.zip .
          cd ..
          ls -lh airsoft_3d_model_pack.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: airsoft-3d-model-pack
          path: airsoft_3d_model_pack.zip
          if-no-files-found: error
          retention-days: 30
